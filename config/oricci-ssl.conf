<VirtualHost *:80>
    ServerName oricci.local
    Redirect permanent / https://oricci.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName oricci.local
    DocumentRoot /var/www/oricci

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/oricci.local.pem
    SSLCertificateKeyFile /etc/apache2/ssl/oricci.local-key.pem

    <Directory /var/www/oricci>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/
    ProxyPass /health http://127.0.0.1:3000/health
    ProxyPassReverse /health http://127.0.0.1:3000/health
</VirtualHost>
